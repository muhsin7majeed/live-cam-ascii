<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Live Camera to ASCII Art</title>
    <link rel="stylesheet" href="/css/styles.css" />
  </head>

  <body>
    <div class="container">
      <h1>Live Camera to ASCII Art</h1>

      <div class="controls">
        <div class="input-group">
          <label for="asciiChars">ASCII Characters (dark to light):</label>
          <input
            type="text"
            id="asciiChars"
            value=" .:-=+*#%@"
            placeholder="Enter characters from dark to light"
          />
        </div>
      </div>

      <div class="output-container">
        <div class="output-section">
          <div class="output-label">Camera View</div>
          <video id="video" autoplay playsinline></video>
        </div>
        <div class="output-section">
          <div class="output-label">ASCII Art</div>
          <pre id="ascii"></pre>
        </div>
      </div>
    </div>

    <script type="module" src="/js/main.js"></script>
  </body>
</html>
